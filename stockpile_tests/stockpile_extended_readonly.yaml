name: StockPile extended read-only verification suite (Phase 2)
module: stockpile-controller
tags:
- extended
- read-only
- phase-2
tests:
- name: 'StockPile read-only: GET /api/health'
  module: stockpile-controller
  tags:
  - health
  - read-only
  source: handwritten
  status: approved
  request:
    method: GET
    url: http://localhost:8080/api/health
    timeout: 10.0
  assertions:
  - type: status
    equals: 200
  - type: json_schema
    schema:
      type: object
      required:
      - status
      - database
      - databaseType
      - totalProducts
      - totalMovements
      - timestamp
      properties:
        status:
          type: string
        database:
          type: string
        databaseType:
          type: string
        totalProducts:
          type: integer
          minimum: 0
        totalMovements:
          type: integer
          minimum: 0
        timestamp:
          type: string
  - type: jsonpath
    path: $.status
    equals: UP
  - type: jsonpath
    path: $.database
    equals: CONNECTED
  - type: jsonpath
    path: $.databaseType
    equals: SQLite

- name: 'StockPile read-only: GET /api/dashboard'
  module: stockpile-controller
  tags:
  - dashboard
  - read-only
  source: handwritten
  status: approved
  request:
    method: GET
    url: http://localhost:8080/api/dashboard
    timeout: 10.0
  assertions:
  - type: status
    equals: 200
  - type: json_schema
    schema:
      type: object
      required:
      - totalProducts
      - totalQuantity
      - inventoryValuePaise
      - summary
      - liveState
      - periodActivity
      properties:
        totalProducts:
          type: integer
          minimum: 0
        totalQuantity:
          type: integer
          minimum: 0
        inventoryValuePaise:
          type: integer
          minimum: 0
        summary:
          type: object
        liveState:
          type: object
        periodActivity:
          type: object
  - type: jsonpath
    path: $.liveState.totalProducts
    type_check: integer
  - type: jsonpath
    path: $.periodActivity.period
    equals: TODAY

