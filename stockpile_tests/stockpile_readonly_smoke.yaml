# Curated safe subset of generated_suite.yaml. GET-only, no resource IDs.
# Only run against a disposable local StockPile test instance.
name: StockPile read-only smoke validation (curated)
module: stockpile-controller
tags:
- smoke
- read-only
tests:
- name: 'StockPile smoke: GET /api/health'
  module: stockpile-controller
  tags:
  - smoke
  - read-only
  source: handwritten
  status: approved
  request:
    method: GET
    url: http://localhost:8080/api/health
    timeout: 10.0
  assertions:
  - type: status
    equals: 200
  - type: json_schema
    schema:
      type: object
