name: ApiScope Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint Code (ruff check)
        run: |
          ruff check .

      - name: Verify Code Formatting (ruff format)
        run: |
          ruff format --check .

      - name: Compile Bytecode (compileall)
        run: |
          python -m compileall src sample_app

      - name: Run Test Suite with Coverage (pytest)
        run: |
          python -m pytest tests --cov=apiscope --cov-report=term-missing
